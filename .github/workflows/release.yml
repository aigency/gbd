name: release

# Release-on-merge: every push to `main` computes a semver bump from
# conventional commits since the last release; if one is warranted, this
# workflow bumps Cargo.toml/Cargo.lock, renders the changelog, tags, builds
# three-target tarballs + SHA256SUMS, smoke-tests, and publishes a GitHub
# Release. If no commit in range warrants a release (docs/chore-only
# merges), the run skips quietly after the `version` job.
#
# Why one workflow instead of a separate "bump-and-tag bot": pushes/tags
# created with a workflow's default GITHUB_TOKEN do NOT trigger other
# workflows (GitHub's recursion guard). A separate bot workflow would push a
# tag that silently never fires a tag-triggered release workflow. Doing
# everything here means the version bump, tag, build, and publish all run in
# the same job graph — and the release commit this workflow pushes back to
# `main` cannot re-trigger itself (or CI): no loop.
#
# First release: this repo may have no `v*` tags yet. Missing tags are
# treated as v0.0.0 so a `feat:` squash-merge becomes v0.1.0.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_bump:
        description: 'Force a release at this bump level regardless of commit history'
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

# Releases must QUEUE, not cancel each other — a canceled half-release can
# leave a tag with no release behind it.
concurrency:
  group: release-main
  cancel-in-progress: false

# Default to read; jobs opt up to write where they actually need it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # GitHub Actions deprecates Node.js 20 in 2026: forced default flips to Node 24
  # on June 2 2026 and Node 20 is removed on September 16 2026. Opt into Node 24
  # now so the deprecation warnings stop.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    name: version
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      release: ${{ steps.compute.outputs.release }}
    steps:
      # Check out `main` (not github.sha): a queued run picks up release
      # commits pushed by the run before it.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: compute
        env:
          FORCE_BUMP: ${{ inputs.force_bump }}
        run: |
          set -euo pipefail

          # Idempotency guard: if HEAD is already tagged, this is a re-run
          # (e.g. a retried build/smoke/release leg) — reuse that tag rather
          # than computing (and re-pushing) a new one. The bump step below
          # re-checks this and no-ops if so.
          if TAG=$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null); then
            echo "HEAD is already tagged $TAG — treating as a re-run"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            RANGE="${LAST}..HEAD"
          else
            # No v* tags yet. Seed 0.0.0 and scan the whole reachable history.
            LAST="v0.0.0"
            RANGE="HEAD"
          fi
          LAST_VERSION="${LAST#v}"

          if [ -n "${FORCE_BUMP:-}" ] && [ "$FORCE_BUMP" != "auto" ]; then
            IFS='.' read -r major minor patch <<< "$LAST_VERSION"
            case "$FORCE_BUMP" in
              major) NEXT="$((major + 1)).0.0" ;;
              minor) NEXT="${major}.$((minor + 1)).0" ;;
              patch) NEXT="${major}.${minor}.$((patch + 1))" ;;
              *) echo "unknown force_bump: $FORCE_BUMP" >&2; exit 1 ;;
            esac
          else
            NEXT=$(bash scripts/next-version.sh "$LAST_VERSION" "$RANGE")
          fi

          if [ -z "$NEXT" ]; then
            echo "no releasable commits since $LAST — skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "next version: $NEXT (from $LAST via $RANGE)"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Install cargo-edit
        if: steps.compute.outputs.release == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Install git-cliff
        if: steps.compute.outputs.release == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Bump, render changelog, tag, and push
        if: steps.compute.outputs.release == 'true'
        env:
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          set -euo pipefail

          # If the idempotency guard above already found this exact tag at
          # HEAD, there is nothing left to bump — this is a re-run of a
          # downstream leg (build/smoke/release), not a fresh version.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1 \
            && [ "$(git rev-parse "$TAG")" = "$(git rev-parse HEAD)" ]; then
            echo "$TAG already exists at HEAD — nothing to bump"
            exit 0
          fi

          NEXT="${TAG#v}"

          # `cargo set-version` updates Cargo.toml only. `cargo update --workspace`
          # rewrites the root package version in Cargo.lock so `cargo build
          # --locked` in the build job does not fail on a stale lockfile.
          cargo set-version "$NEXT"
          cargo update --workspace

          git cliff --tag "$TAG" -o CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git tag "$TAG"

          # --atomic is load-bearing: without it, a raced push can PARTIALLY
          # succeed — main rejected as non-fast-forward while the tag still
          # lands — leaving a stray tag pointing at a commit that never
          # reached main.
          git push --atomic origin main "$TAG"

  build:
    name: build (${{ matrix.target }})
    needs: [version]
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    # id-token + attestations: sign a build-provenance statement for each
    # tarball with the workflow's own identity (verify with
    # `gh attestation verify <file> --repo aigency/gbd`). No key to manage.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
        # x86_64-apple-darwin is intentionally NOT in the matrix. macos-13
        # x86_64 runners have unbounded GitHub queue waits and the Intel-Mac
        # install base is small. Intel Mac users build from source via
        # `cargo install --locked --git https://github.com/aigency/gbd`;
        # the curl installer surfaces this fallback on Darwin x86_64.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Read pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install mold linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Configure mold as the Linux linker
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      # `release-ci` is a `release`-derived profile in Cargo.toml that bumps
      # codegen-units 1→16 for compile-time parallelism.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --profile release-ci --locked --target "$TARGET"

      - name: Strip binary
        env:
          TARGET: ${{ matrix.target }}
        run: strip "target/$TARGET/release-ci/gbd"

      - name: Package tarball + sha256
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          TARBALL="gbd-${TAG}-${TARGET}.tar.gz"
          tar czf "${TARBALL}" -C "target/${TARGET}/release-ci" gbd
          shasum -a 256 "${TARBALL}" > "${TARBALL}.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: gbd-${{ needs.version.outputs.tag }}-${{ matrix.target }}.tar.gz

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.version.outputs.tag }}-${{ matrix.target }}
          path: |
            gbd-${{ needs.version.outputs.tag }}-${{ matrix.target }}.tar.gz
            gbd-${{ needs.version.outputs.tag }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke (ubuntu)
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-${{ needs.version.outputs.tag }}-x86_64-unknown-linux-gnu
          path: dist/
          merge-multiple: true

      - name: Smoke-test the Linux x86_64 binary
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          TARBALL="dist/gbd-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$TARBALL" -C /tmp
          BIN=/tmp/gbd
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" ping

  release:
    name: release
    needs: [version, build, smoke]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        working-directory: dist
        run: |
          cat gbd-*.tar.gz.sha256 > SHA256SUMS
          cat SHA256SUMS

      # minisign: one `.sig` per tarball (what cargo binstall verifies against
      # the pubkey in Cargo.toml) and SHA256SUMS.minisig (what install.sh
      # verifies). The key is the MINISIGN_KEY secret; the pubkey is read from
      # Cargo.toml at this tag and every signature is verified against it
      # before upload, so a wrong secret fails here rather than at install time.
      - name: Sign release assets (minisign)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_KEY" ]; then
            echo "MINISIGN_KEY is not set; Cargo.toml declares a pubkey, so an unsigned release would be uninstallable with cargo binstall" >&2
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign >/dev/null
          KEY="$RUNNER_TEMP/minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$KEY"
          PUBKEY=$(sed -n 's/^pubkey = "\(.*\)"/\1/p' Cargo.toml)
          for f in dist/gbd-*.tar.gz dist/SHA256SUMS; do
            case "$f" in
              *.tar.gz) sig="$f.sig" ;;
              *)        sig="$f.minisig" ;;
            esac
            minisign -S -W -s "$KEY" -x "$sig" -m "$f"
            minisign -V -q -P "$PUBKEY" -x "$sig" -m "$f"
            echo "signed and verified: $f"
          done
          rm -f "$KEY"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Notes must span since the last PUBLISHED release, not the last
          # tag: if a build leg failed after `version` pushed a tag, that
          # tag exists but has no release.
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' || true)
          if [ -n "$PREV" ]; then
            git cliff "${PREV}..${TAG}" --tag "$TAG" -o RELEASE_NOTES.md
          else
            git cliff --latest --tag "$TAG" -o RELEASE_NOTES.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/gbd-*.tar.gz \
              dist/gbd-*.tar.gz.sig \
              dist/SHA256SUMS \
              dist/SHA256SUMS.minisig \
              --clobber
          else
            gh release create "$TAG" \
              dist/gbd-*.tar.gz \
              dist/gbd-*.tar.gz.sig \
              dist/SHA256SUMS \
              dist/SHA256SUMS.minisig \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md
          fi

  # Runs only when CARGO_REGISTRY_TOKEN is set (a secret cannot be read in
  # `if:` directly, so it is routed through env). The first publish of a new
  # crate must be done by a human with `cargo publish`; after that this
  # keeps crates.io in step with GitHub Releases so `cargo binstall gbd`
  # and `cargo install gbd` resolve.
  publish:
    name: crates.io
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Read pinned toolchain
        if: env.CARGO_REGISTRY_TOKEN != ''
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
      - name: Skipped
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "CARGO_REGISTRY_TOKEN is not set; not publishing to crates.io"
