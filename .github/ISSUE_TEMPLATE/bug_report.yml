name: Bug report
description: Something gbd does wrong
labels: []
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `gbd --version` and `gh --version`
      placeholder: gbd 0.3.0 (1a2b3c4) · gh version 2.100.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command, with `--json` if it has one, and what it printed (stdout and stderr).
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: gbd doctor
      description: Output of `gbd doctor`, if the problem could be about setup.
      render: shell
