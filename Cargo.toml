[package]
name = "gbd"
version = "1.4.0"
edition = "2021"
rust-version = "1.89"
build = "build.rs"
license = "MIT"
description = "The Beads agent workflow on GitHub Issues and Projects"
repository = "https://github.com/aigency/gbd"
homepage = "https://github.com/aigency/gbd"
keywords = ["github", "issues", "projects", "agents", "beads"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
authors = ["Glenn Scott"]

[[bin]]
name = "gbd"
path = "src/main.rs"

# Pedantic is enforced (CI runs clippy with -D warnings). The allows are the
# documentation lints that would only add boilerplate to a small CLI.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"

[dependencies]
anyhow = "1"
clap = { version = "=4.6.6", features = ["derive"] }
clap_complete = "=4.6.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
tempfile = "=3.27.0"

[package.metadata.binstall]
pkg-url = "https://github.com/aigency/gbd/releases/download/v{ version }/gbd-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }"
pkg-fmt = "tgz"

# cargo binstall downloads `{ url }.sig` next to each tarball and refuses a
# mismatch. The private half is the MINISIGN_KEY secret used by release.yml.
[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWTJfFNVFWOcQa3j8m8WBvpgOGO0qocEnMMt8UnIb0wqO0KLgvwb6Fi4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Faster CI release builds. Used by .github/workflows/release.yml.
[profile.release-ci]
inherits = "release"
codegen-units = 16
